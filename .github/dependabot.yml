version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # Testwerkzeuge (pytest, ruff) für pi/. Was der Pi selbst installiert, steht in pi/install-kiosk.sh.
  - package-ecosystem: pip
    directory: "/pi"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      testwerkzeuge:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
