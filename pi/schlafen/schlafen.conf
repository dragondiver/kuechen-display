# Einstellungen fürs Schlafen des Küchen-Displays (kuechen-display#48).
# Das ist die einzige Stelle für diese Werte. Auf dem Pi liegt die Datei unter
# ~/kuechen-display/schlafen/schlafen.conf; nach einer Änderung dort (oder per pi/push.sh):
#   sudo systemctl restart kuechen-schlafen
# Anleitung: docs/schlafen.md

# Sekunden ohne Berührung, bis das Display ausgeht (Festlegung 16.11.2026: 5 Minuten).
# Wird mit der Anwesenheitserkennung (#12, #19) neu eingestellt.
RUHE_S=300

# Wie das Display ausgeht:
#   beides     Ausgang aus (wlopm) und Beleuchtung auf 0
#   backlight  nur die Beleuchtung auf 0
#   ausgang    nur der Ausgang aus (wlopm)
# Ob die Beleuchtung allein reicht oder der Ausgang allein wieder sauber aufwacht, ist am
# Gerät noch nicht gemessen; "beides" ist der vorsichtige Anfang.
AUS_WEG=beides
