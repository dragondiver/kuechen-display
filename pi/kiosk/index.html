<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=800, initial-scale=1">
<title>Küchen-Display</title>
<!--
  Ruhebildschirm für den Chromium-Kiosk auf dem Pi (Durchstich zu #15 und #2).
  Aufbau und Aussehen aus docs/entwuerfe/ruhebildschirm.html, Entwurf C4 (Seiten) mit
  Wetterbild W5 (flach). Wetter und Termine kommen aus Home Assistant (docs/datenweg.md).

  Seiten: Apps 2 ← Apps 1 ← Heute → Morgen/Woche. Blättern per Wischen auf dem Bildschirm,
  per Tippen auf „Morgen … ›“ oder per Handgeste vor der Kamera (Ereignisse vom Gestendienst
  über /ereignisse). Morgen/Woche springt nach 5 Minuten ohne Bedienung zurück auf Heute.

  ?messen=1  blättert 60 s lang selbst hin und her und schickt die Bildraten an /messung.
  ?debug=1   zeigt erkannte Gesten unten links an.
  ?seite=apps (oder morgen) öffnet gleich diese Seite; so kommt die Rückweg-Leiste aus einer App
             zurück auf die Apps-Seite (pi/kiosk-rueckweg, #10).
-->
<style>
  /* Schrift liegt bei (schrift/, OFL): Auf dem Pi gibt es weder SF Pro noch Helvetica, und
     Nimbus Sans hat keinen dünnen Schnitt für Uhr und Temperatur. Eine Datei für alle Stärken. */
  @font-face { font-family: "Hanken Grotesk"; src: url("schrift/hanken-grotesk.woff2") format("woff2");
               font-weight: 100 900; font-style: normal; font-display: block; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #000; cursor: none; }
  .scr { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; overflow: hidden;
         font-family: "Hanken Grotesk", "Nimbus Sans", sans-serif; color: #fff; line-height: normal;
         user-select: none; -webkit-user-select: none; }
  .scr * { box-sizing: border-box; }
  .wetterbild { position: absolute; inset: 0; width: 1280px; height: 800px; object-fit: cover; }
  .uhr { font-size: 92px; font-weight: 200; letter-spacing: -2px; line-height: 1; }
  .datum { font-size: 30px; font-weight: 400; opacity: .8; margin-top: 10px; }
  .kopf { font-size: 20px; letter-spacing: 3px; text-transform: uppercase; opacity: .55; margin: 40px 0 20px; }
  .termin { display: flex; align-items: baseline; gap: 26px; padding: 16px 0; border-top: 1px solid rgba(255,255,255,.14); }
  .termin .zeit { font-size: 30px; font-weight: 300; width: 96px; font-variant-numeric: tabular-nums; opacity: .85; }
  .termin .zeit.spanne { width: 190px; }
  .termin .titel { font-size: 34px; font-weight: 400; flex: 1; }
  .termin .wer { font-size: 22px; opacity: .65; display: flex; align-items: center; gap: 10px; }
  .punkt { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; }
  .p1 { background: #f5d547; } .p2 { background: #ff5f57; } .pa { background: #d9d9d9; }
  .mehr { font-size: 22px; opacity: .55; margin-top: 22px; }
  .temp { font-size: 150px; font-weight: 200; line-height: .9; letter-spacing: -6px; }
  .zustand { font-size: 34px; font-weight: 400; margin-top: 8px; }
  .hoch { font-size: 26px; opacity: .75; margin-top: 8px; }
  /* Wetterwarnung ab Stufe 2: eine Zeile unten in der Wetterkarte, Punkt in der DWD-Farbe (#37). */
  .warnung { display: flex; align-items: center; gap: 12px; margin-top: 22px; font-size: 22px; opacity: .85; }
  .warnung[hidden] { display: none; }
  .warnung .punkt { background: var(--warn, #d9d9d9); }
  .warnung .text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .warnung .plus { flex: none; opacity: .65; }
  .ort { font-size: 20px; letter-spacing: 3px; text-transform: uppercase; opacity: .55; margin-bottom: 18px; }
  .glas { background: rgba(20,24,32,.38); backdrop-filter: blur(28px) saturate(1.3);
          border-radius: 36px; border: 1px solid rgba(255,255,255,.12); }
  .glas.spalte { display: flex; flex-direction: column; }
  .rolle { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; padding-bottom: 60px;
           mask-image: linear-gradient(180deg, #000 82%, transparent); }
  .tag { font-size: 18px; letter-spacing: 3px; text-transform: uppercase; opacity: .55; margin: 22px 0 4px; display: flex; justify-content: space-between; }
  .tag:first-child { margin-top: 0; }
  .eintrag { display: flex; align-items: baseline; gap: 18px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.14); }
  .eintrag .zeit { font-size: 24px; font-weight: 300; width: 70px; font-variant-numeric: tabular-nums; opacity: .85; flex: none; }
  .eintrag .titel { font-size: 26px; font-weight: 400; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eintrag .punkt { width: 12px; height: 12px; }
  .eintrag.leer .titel { font-weight: 400; opacity: .45; }
  /* Ganztägige Termine stehen oben, statt der Uhrzeit „ganztägig“ (#15, 15.11.2026). */
  .termin .zeit.ganz { width: auto; min-width: 96px; font-size: 24px; }
  .eintrag .zeit.ganz { width: auto; min-width: 70px; font-size: 18px; }
  .termin.leer .titel { font-weight: 400; opacity: .45; }
  /* „Noch heute“ rollt per Wischen nach oben und unten, wenn nicht alles passt (15.11.2026).
     Nur dann wird der untere Rand weich, als Zeichen, dass noch etwas kommt. */
  .liste { flex: 0 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; }
  .liste.weiter { mask-image: linear-gradient(180deg, #000 80%, transparent); }
  /* Nur die Glaskarten gleiten, das Wetterbild steht still (#15). */
  .bahn { position: absolute; top: 0; left: 0; width: 5120px; height: 800px; display: flex;
          transform: translateX(calc(var(--seite, 2) * -1280px)); transition: transform .55s cubic-bezier(.22,.8,.24,1); touch-action: pan-y; }
  .seite { position: relative; width: 1280px; height: 800px; flex: none; }
  .raster { position: absolute; left: 0; right: 0; top: 120px; display: grid; grid-template-columns: repeat(3, 168px); justify-content: center; column-gap: 150px; row-gap: 64px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .symbol { width: 168px; height: 168px; border-radius: 40px; display: grid; place-items: center; background: rgba(20,24,32,.38);
            backdrop-filter: blur(28px) saturate(1.3); border: 1px solid rgba(255,255,255,.12); }
  .symbol.orange { background: #e8762b; border-color: transparent; }
  .symbol svg { width: 84px; height: 84px; }
  /* Kacheln mit Adresse öffnen die Seite im Kiosk, zurück geht es über pi/kiosk-rueckweg (#10). */
  .app[data-adresse] .symbol { transition: transform .12s, background .12s; }
  .app[data-adresse]:active .symbol { transform: scale(.95); background: rgba(20,24,32,.6); }
  .appname { font-size: 26px; font-weight: 500; text-shadow: 0 1px 12px rgba(0,0,0,.35); }
  .punkte { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; gap: 14px; }
  .punkte i { width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .punkte i.an { background: #fff; }
  .mehr[data-weiter] { cursor: pointer; }
  /* Blass: veraltete Daten (älter als eine Stunde) oder kein Netz (#50). Uhr, Datum und die
     Überschriften der Seiten bleiben; die Wetterkarte tritt als Ganzes zurück. */
  .blass { opacity: .45; }
  .scr[data-termine="blass"] :is(.kopf, .liste, .rolle, .mehr) { opacity: .45; }
  /* Gesperrt (#82): Schloss statt der Einträge, ohne Zahl. Die Karte dunkelt beim langen Drücken kurz nach,
     wie die Kacheln beim Antippen. */
  .sperre { display: flex; align-items: center; gap: 18px; padding: 16px 0; border-top: 1px solid rgba(255,255,255,.14); }
  .sperre svg { width: 40px; height: 40px; flex: none; opacity: .75; }
  .sperre .titel { font-size: 26px; font-weight: 400; opacity: .65; }
  .glas[data-termine] { transition: background .2s; }
  .glas[data-termine].gedrueckt { background: rgba(20,24,32,.6); }
  .kein-netz { position: absolute; left: 64px; bottom: 12px; font-size: 20px; letter-spacing: 3px;
               text-transform: uppercase; opacity: .65; pointer-events: none; }
  .kein-netz[hidden] { display: none; }
  /* Rückmeldung für die flache Hand: kurz ein ruhiges Zeichen, keine dauernde Bewegung. */
  .stopp { position: absolute; left: 50%; top: 50%; width: 180px; height: 180px; margin: -90px 0 0 -90px; border-radius: 50%;
           display: grid; place-items: center; background: rgba(20,24,32,.45); backdrop-filter: blur(28px);
           border: 1px solid rgba(255,255,255,.18); opacity: 0; transition: opacity .25s; pointer-events: none; }
  .stopp.an { opacity: 1; }
  .stopp svg { width: 88px; height: 88px; }
  /* ===== Elektra: Figur F2 unten rechts (Entwurf ruhebildschirm.html) ===== */
  .figur { position: absolute; right: 70px; bottom: 40px; width: 250px; height: 260px; overflow: visible; }
  .figur .fb, .figur .kopf-f { opacity: 0; transition: opacity .3s; }
  .figur .boegen path { fill: none; stroke: #f39a2b; stroke-linecap: round; stroke-width: 6; opacity: 0; transition: opacity .4s; }
  .figur .boegen .b2 { stroke-width: 5; }
  .scr:not([data-zustand="aus"]) .figur .kopf-f { opacity: 1; }
  .scr[data-zustand="zuhoeren"] .figur .fb-zuhoeren,
  .scr[data-zustand="nachdenken"] .figur .fb-nachdenken,
  .scr[data-zustand="sprechen"] .figur .fb-sprechen-offen { opacity: 1; }
  .scr[data-zustand="zuhoeren"] .figur .b1 { opacity: .45; } .scr[data-zustand="zuhoeren"] .figur .b2 { opacity: .2; }
  .scr[data-zustand="sprechen"] .figur .b1 { opacity: 1; } .scr[data-zustand="sprechen"] .figur .b2 { opacity: .7; }
  .figur .mikro { cursor: pointer; transition: opacity .3s; }
  .scr[data-zustand="aus"] .figur .mikro { opacity: .55; }
  .scr[data-verbunden="nein"] .figur .mikro { opacity: .2; }
  .scr:not([data-zustand="aus"]) .figur .mikro circle { filter: drop-shadow(0 0 8px rgba(243,154,43,.9)); }
  .figur .tippflaeche { fill: transparent; cursor: pointer; }
  .zeile { position: absolute; right: 340px; bottom: 70px; max-width: 560px; padding: 22px 30px; font-size: 28px; line-height: 1.3;
           opacity: 0; transition: opacity .3s; pointer-events: none;
           display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .zeile.an { opacity: 1; }
  .zeile.nutzer { font-style: italic; opacity: 0; }
  .zeile.nutzer.an { opacity: .85; }
  /* === Lautstärke-Schieber (#103) ===================================================================
     Übergangslösung bis zum Drehregler in der Front (#7). senkrechte Glaspille am rechten Rand neben dem Mikrofon der Figur
     (links davon stößt sie an die Sprechzeile), auf allen Seiten sichtbar. Rückbau: docs/kiosk-und-gesten.md, „Lautstärke“. */
  .lautstaerke { position: absolute; right: 14px; bottom: 40px; width: 56px; height: 330px; border-radius: 28px;
                 opacity: .3; transition: opacity .3s; }
  .lautstaerke[data-bereit="ja"] { opacity: 1; }
  .lautstaerke svg { position: absolute; left: 13px; bottom: 12px; width: 30px; height: 30px; }
  .lautstaerke[data-stumm="ja"] svg { opacity: .6; }
  /* Der Schieber liegt als normaler waagerechter Regler da und ist um 90° gedreht: rechts ist oben. */
  .lautstaerke input { -webkit-appearance: none; appearance: none; position: absolute; left: 50%; top: 141px; width: 250px; height: 56px;
                       margin: 0; transform: translate(-50%, -50%) rotate(-90deg); background: transparent;
                       touch-action: none; cursor: pointer; outline: none; --fuellung: 60%; }
  .lautstaerke input::-webkit-slider-runnable-track {
    height: 8px; border-radius: 4px;
    background: linear-gradient(to right, #f39a2b var(--fuellung), rgba(255,255,255,.25) var(--fuellung)); }
  .lautstaerke input::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 36px; height: 36px; margin-top: -14px; border-radius: 50%;
    background: #fff4e2; border: 0; box-shadow: 0 0 0 4px rgba(243,154,43,.35), 0 2px 8px rgba(0,0,0,.45); }
  .lautstaerke input:active::-webkit-slider-thumb { box-shadow: 0 0 0 9px rgba(243,154,43,.35), 0 2px 8px rgba(0,0,0,.45); }
  /* === Ende Lautstärke-Schieber === */
  .debug { position: absolute; left: 16px; bottom: 16px; font: 16px/1.3 "DejaVu Sans Mono", monospace; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 8px; display: none; }
  .debug.an { display: block; }
  .debug .hand { opacity: .75; }
</style>
</head>

  <div class="bahn" id="bahn">

<script>
(function () {
  const HEUTE = 2, LETZTE = 3, ZURUECK_MS = 5 * 60 * 1000;
  const scr = document.getElementById('scr');
  const param = new URLSearchParams(location.search);
  const debug = document.getElementById('debug');
  if (param.has('debug')) debug.classList.add('an');
  debug.innerHTML = '<div class="hand">Hand: –</div><div class="letzte">noch keine Geste</div>';
  function zeigeDebug(text) { debug.querySelector('.letzte').textContent = new Date().toLocaleTimeString('de-DE') + '  ' + text; }

  function uhrzeit() {
    const jetzt = new Date();
    document.getElementById('uhr').textContent = jetzt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('datum').textContent = jetzt.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
    const morgen = new Date(jetzt.getTime() + 864e5);
    document.getElementById('datum-morgen').textContent = morgen.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  uhrzeit();
  setInterval(uhrzeit, 1000);

  // Blättern
  let seite = HEUTE, ruecksprung = null;
  function setzeSeite(i) {
    seite = Math.max(0, Math.min(LETZTE, i));
    scr.style.setProperty('--seite', seite);
    document.querySelectorAll('#punkte i').forEach(function (p, n) { p.classList.toggle('an', n === seite); });
    clearTimeout(ruecksprung);
    if (seite !== HEUTE) ruecksprung = setTimeout(function () { setzeSeite(HEUTE); }, ZURUECK_MS);
  }
  const SEITEN = { apps: 1, heute: HEUTE, morgen: LETZTE };
  if (param.get('seite') in SEITEN) setzeSeite(SEITEN[param.get('seite')]);
  // Richtung wie auf dem Touchscreen: nach links wischen holt die rechte Seite herein.
  function wischen(richtung) { setzeSeite(seite + (richtung === 'links' ? 1 : -1)); }

  // Lang drücken auf eine Terminkarte sperrt die Termine (#82). Der Druck zählt nur, wenn der Finger
  // fast still liegt (Regeln.langerDruck); danach schluckt die Seite den Klick, der auf das Loslassen
  // folgt, damit „Morgen ›“ oder eine Kachel nicht nebenbei auslöst.
  let sperrbar = false, gesperrt = false, druck = null, klickSchlucken = false;
  function druckAbbrechen() { if (druck) { clearTimeout(druck.timer); druck = null; } }
  function druckBeginnt(e) {
    druckAbbrechen();
    klickSchlucken = false;
    const karte = e.target.closest('[data-termine]');
    if (!karte || !sperrbar || gesperrt || e.target.closest('.mehr[data-weiter]')) return;
    const d = { x: e.clientX, y: e.clientY, t: Date.now(), karte: karte };
    d.timer = setTimeout(function () { druckZaehlt(d); }, Regeln.LANG_MS);
    druck = d;
  }
  function druckZaehlt(d) {
    if (druck !== d) return;
    druck = null;
    start = null;
    klickSchlucken = true;
    d.karte.classList.add('gedrueckt');
    setTimeout(function () { d.karte.classList.remove('gedrueckt'); klickSchlucken = false; }, 1500);
    melde('/sperren');
  }
  addEventListener('click', function (e) {
    if (!klickSchlucken) return;
    klickSchlucken = false;
    e.stopPropagation(); e.preventDefault();
  }, true);
  document.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-termine]')) e.preventDefault(); });
  let weg = 0;  // wie weit der Finger zuletzt gezogen hat; ein Wischer über eine Kachel öffnet sie nicht
  document.addEventListener('click', function (e) {
    if (e.target.closest('.mehr[data-weiter]')) setzeSeite(LETZTE);
    const app = e.target.closest('.app[data-adresse]');
    if (app && weg < 12) location.href = app.dataset.adresse;
  });
  // Auf dem Pi kommt das Wischen als Pointer-Ziehen an, nicht als Touch-Rollen (Test 15.11.2026):
  // Chromium rollt die Listen dann nicht selbst. Deshalb rollt die Seite sie hier nach dem
  // Finger. Rollt der Browser doch selbst, kommt pointercancel und die Seite hält sich raus.
  let start = null;
  document.addEventListener('pointerdown', function (e) {
    druckBeginnt(e);
    const liste = e.target.closest('.liste, .rolle');
    start = { x: e.clientX, y: e.clientY, liste: liste, oben: liste ? liste.scrollTop : 0, rollt: false };
  });
  document.addEventListener('pointermove', function (e) {
    if (druck && !Regeln.langerDruck(Regeln.LANG_MS, Math.hypot(e.clientX - druck.x, e.clientY - druck.y))) druckAbbrechen();
    if (!start || !start.liste) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (!start.rollt && Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) start.rollt = true;
    if (start.rollt) start.liste.scrollTop = start.oben - dy;
  });
  document.addEventListener('pointercancel', function () { start = null; druckAbbrechen(); });
  document.addEventListener('pointerup', function (e) {
    druckAbbrechen();
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    weg = Math.hypot(dx, dy);
    if (!start.rollt && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) wischen(dx < 0 ? 'links' : 'rechts');
    start = null;
  });

  // Flache Hand: Stopp. Die Rückmeldung zeigt die Seite, angehalten wird im Dienst (Wiedergabe, Bridge).
  const stoppZeichen = document.getElementById('stopp');
  let stoppAus = null;
  function stopp() {
    stoppZeichen.classList.add('an');
    clearTimeout(stoppAus);
    stoppAus = setTimeout(function () { stoppZeichen.classList.remove('an'); }, 900);
  }

  // Ereignisse vom Küchen-Dienst (pi/dienst/dienst.py): Gesten, Elektras Zustand, Befehle
  function melde(pfad, daten) {
    return fetch(pfad, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Kuechen': '1' }, body: JSON.stringify(daten || {}) });
  }
  const zeile = document.getElementById('zeile');
  function zeigeZeile(rolle, text) {
    zeile.textContent = text;
    zeile.classList.toggle('nutzer', rolle === 'nutzer');
    zeile.classList.toggle('an', !!text);
  }
  // Beim Verlassen (App öffnen, Neuladen) dem Dienst Bescheid geben, sonst schickt er Befehle
  // noch bis zu 15 s an diese Seite (verifier zu #71).
  addEventListener('pagehide', function () { navigator.sendBeacon('/weg'); });
  const quelle = new EventSource('/ereignisse');
  quelle.addEventListener('hand', function (e) {
    const h = JSON.parse(e.data);
    debug.querySelector('.hand').textContent = h.x === undefined ? 'Hand: –'
      : 'Hand: x ' + h.x.toFixed(2) + '  y ' + h.y.toFixed(2) + '  ' + (h.form || '?') + ' ' + h.sicher;
  });
  quelle.addEventListener('geste', function (e) {
    const g = JSON.parse(e.data);
    zeigeDebug(g.art + (g.richtung ? ' ' + g.richtung : ''));
    if (g.art === 'wischen') wischen(g.richtung);
    else if (g.art === 'stopp') stopp();
  });
  quelle.addEventListener('verbindung', function (e) {
    scr.dataset.verbunden = JSON.parse(e.data).da ? 'ja' : 'nein';
  });
  quelle.addEventListener('zustand', function (e) {
    const wert = JSON.parse(e.data).wert;
    scr.dataset.zustand = wert;
    zeigeDebug('Elektra: ' + wert);
    if (wert === 'aus') zeigeZeile('', '');
  });
  quelle.addEventListener('text', function (e) {
    const t = JSON.parse(e.data);
    zeigeZeile(t.rolle, t.text);
  });
  // Wetter vom Küchen-Dienst (pi/dienst/daten.py). Ohne Daten bleibt „Keine Wetterdaten“ stehen.
  // Sind die Daten älter als eine Stunde, tritt die Karte zurück (ALT_MS), statt Falsches zu behaupten.
  // Dieselbe Regel gilt für die Termine (#50, regeln.js) und, sofort, wenn das Netz fehlt.
  let wetterStand = 0, termineStand = 0, netzDa = true;
  const wetterKarte = document.getElementById('w-temp').parentElement;
  const keinNetz = document.getElementById('kein-netz');
  function wetterAlter() {
    const jetzt = Date.now();
    wetterKarte.classList.toggle('blass', !netzDa || Regeln.istAlt(wetterStand, jetzt));
    scr.dataset.termine = !netzDa || Regeln.istAlt(termineStand, jetzt) ? 'blass' : '';
    keinNetz.hidden = netzDa;
  }
  quelle.addEventListener('netz', function (e) {
    netzDa = JSON.parse(e.data).da;
    wetterAlter();
  });
  quelle.addEventListener('wetter', function (e) {
    const w = JSON.parse(e.data);
    document.getElementById('w-ort').textContent = w.ort;
    document.getElementById('w-temp').textContent = w.temperatur;
    document.getElementById('w-zustand').textContent = w.zustand;
    document.getElementById('w-zeile').textContent = w.zeile;
    // Warnung (#37): ohne sie bleibt die Zeile weg und die Karte sieht aus wie vorher.
    const warn = document.getElementById('w-warnung');
    warn.hidden = !w.warnung;
    if (w.warnung) {
      warn.style.setProperty('--warn', w.warnung.farbe);
      warn.querySelector('.text').textContent = w.warnung.text;
      warn.querySelector('.plus').textContent = w.warnung.mehr ? '+' + w.warnung.mehr : '';
    }
    const bild = 'wetter/' + w.bild + '.png', img = document.getElementById('wetterbild');
    if (!img.src.endsWith(bild)) img.src = bild;
    wetterStand = w.stand;
    wetterAlter();
  });
  setInterval(wetterAlter, 60000);

  // Termine vom Küchen-Dienst (pi/dienst/daten.py). Jeder Eintrag trägt "bis": Die Seite blendet
  // vorbei gegangene Termine jede Minute selbst aus, der Dienst fragt nur alle zehn Minuten.
  let termine = null;
  function el(tag, klasse, text) {
    const e = document.createElement(tag);
    if (klasse) e.className = klasse;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function zeit(t, extra) {
    return el('div', 'zeit' + (t.zeit === 'ganztägig' ? ' ganz' : extra || ''), t.zeit);
  }
  function terminZeile(t, spanne) {
    const z = el('div', 'termin');
    z.append(zeit(t, spanne ? ' spanne' : ''), el('div', 'titel', t.titel));
    const wer = el('div', 'wer');
    wer.append(el('i', 'punkt ' + t.farbe), t.kalender);
    z.append(wer);
    return z;
  }
  function leer(klasse, text) {
    const z = el('div', klasse + ' leer');
    z.append(el('div', 'zeit'), el('div', 'titel', text));
    return z;
  }
  const heuteListe = document.getElementById('t-heute');
  function weiterZeichen() {
    heuteListe.classList.toggle('weiter', heuteListe.scrollTop + heuteListe.clientHeight < heuteListe.scrollHeight - 4);
  }
  heuteListe.addEventListener('scroll', weiterZeichen);
  function anzahl(n) { return n === 1 ? '1 Termin' : n + ' Termine'; }
  // Gesperrt (#82): Der Dienst schickt gar keine Termine mehr, die Seite wirft ihren Stand weg und
  // zeigt auf jeder Seite das Schloss, ohne Zahl.
  function sperrBlock() {
    const b = el('div', 'sperre');
    b.innerHTML = '<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="28" width="36" height="26" rx="6"/><path d="M22 28v-7a10 10 0 0 1 20 0v7"/><path d="M32 38v7"/></svg>';
    b.append(el('div', 'titel', 'Termine ausgeblendet'));
    return b;
  }
  function zeigeSperre() {
    document.getElementById('t-heute').replaceChildren(sperrBlock());
    heuteListe.classList.remove('weiter');
    document.getElementById('t-mehr').textContent = 'Morgen ›';
    document.getElementById('t-morgen-kopf').textContent = '';
    document.getElementById('t-morgen').replaceChildren(sperrBlock());
    document.getElementById('t-woche').replaceChildren(sperrBlock());
  }
  function zeigeTermine() {
    if (!termine) return;
    const jetzt = Date.now() / 1000;
    const offen = function (t) { return t.bis > jetzt; };
    const heute = termine.heute.filter(offen);
    document.getElementById('t-heute').replaceChildren(...(heute.length ? heute.map(function (t) { return terminZeile(t, false); }) : [leer('termin', 'Keine Termine mehr')]));
    weiterZeichen();
    const morgen = termine.morgen;
    document.getElementById('t-mehr').textContent = 'Morgen ' + (morgen.length ? anzahl(morgen.length) : 'keine Termine') + ' ›';
    document.getElementById('t-morgen-kopf').textContent = morgen.length ? anzahl(morgen.length) : 'Keine Termine';
    document.getElementById('t-morgen').replaceChildren(...morgen.map(function (t) { return terminZeile(t, true); }));
    const woche = [];
    termine.woche.forEach(function (tag) {
      const kopf = el('div', 'tag');
      kopf.append(el('span', '', tag.tag), el('span', '', tag.datum));
      woche.push(kopf);
      const liste = tag.termine.filter(offen);
      if (!liste.length) woche.push(leer('eintrag', 'keine Termine'));
      liste.forEach(function (t) {
        const z = el('div', 'eintrag');
        z.append(zeit(t), el('div', 'titel', t.titel), el('i', 'punkt ' + t.farbe));
        woche.push(z);
      });
    });
    document.getElementById('t-woche').replaceChildren(...woche);
  }
  quelle.addEventListener('termine', function (e) {
    const neu = JSON.parse(e.data);
    sperrbar = !!neu.sperrbar;
    document.querySelectorAll('.gedrueckt').forEach(function (k) { k.classList.remove('gedrueckt'); });
    if (neu.gesperrt) {
      gesperrt = true; termine = null; termineStand = 0;
      zeigeSperre();
      wetterAlter();
      return;
    }
    gesperrt = false;
    termine = neu;
    termineStand = termine.stand;
    wetterAlter();
    zeigeTermine();
  });
  setInterval(zeigeTermine, 60000);
  // Befehle, die Elektra per Werkzeug schickt (rundfunk: server._oberflaechen_werkzeuge)
  quelle.addEventListener('befehl', function (e) {
    const b = JSON.parse(e.data);
    zeigeDebug('Befehl ' + b.name + ' ' + JSON.stringify(b.argumente));
    let fehler = null;
    if (b.name === 'seite_zeigen' && b.argumente.seite in SEITEN) setzeSeite(SEITEN[b.argumente.seite]);
    else if (b.name === 'app_oeffnen') {
      // Apps mit Kachel data-app (#70); erst quittieren, dann wechseln, sonst geht die Quittung verloren.
      const kachel = document.querySelector('.app[data-app="' + CSS.escape(String(b.argumente.name)) + '"]');
      if (kachel) {
        melde('/quittung', { id: b.id, ok: true }).finally(function () { location.href = kachel.dataset.adresse; });
        return;
      }
      fehler = 'Diese App gibt es auf der Anzeige nicht: ' + b.argumente.name;
    }
    else if (b.name === 'rezeptschritt') fehler = 'Es ist kein Rezept offen.';
    else fehler = 'Das kann die Anzeige noch nicht: ' + b.name;
    melde('/quittung', fehler ? { id: b.id, ok: false, fehler: fehler } : { id: b.id, ok: true });
  });
  // Kurzer Hinweis des Dienstes, z. B. wenn die Bridge fehlt (#50): in der Zeile für Elektras Text,
  // nach vier Sekunden weg, falls dort nicht inzwischen etwas anderes steht.
  const HINWEIS_MS = 4000;
  let hinweisZeit = null;
  quelle.addEventListener('hinweis', function (e) {
    const text = JSON.parse(e.data).text;
    zeigeZeile('hinweis', text);
    clearTimeout(hinweisZeit);
    hinweisZeit = setTimeout(function () { if (zeile.textContent === text) zeigeZeile('', ''); }, HINWEIS_MS);
  });
  // Tipp aufs Mikrofon oder auf die Figur: Gespräch beginnen bzw. Elektra anhalten.
  document.getElementById('figur').addEventListener('click', function (e) {
    if (e.target.closest('.mikro, .tippflaeche')) melde('/tipp');
  });

  // === Lautstärke-Schieber (#103) ====================================================================
  // Übergangslösung bis zum Drehregler (#7); Rückbau in docs/kiosk-und-gesten.md. Der Stand kommt als
  // Ereignis `lautstaerke` aus /ereignisse (nicht aus /lage: das hat Nebenwirkungen und gehört der
  // Rückweg-Leiste). Gesendet wird wie in der Leiste (#99): POST /lautstaerke, Stellung 0 bis 100.
  (function () {
    const wirt = document.getElementById('lautstaerke');
    const feld = wirt.querySelector('input'), symbol = wirt.querySelector('svg');
    const lautsprecher = 'M12 26h8l12-10v32L20 38h-8z';
    const wellen = '<path d="M42 24a12 12 0 0 1 0 16M48 18a20 20 0 0 1 0 28"/>';
    const stumm = '<path d="M42 26l12 12M54 26L42 38"/>';
    let wert = 60, zieht = false, bis = 0, sendeZeitgeber = 0;
    function anzeigen(w) {
      feld.value = w;
      feld.style.setProperty('--fuellung', w + '%');
      symbol.innerHTML = '<path d="' + lautsprecher + '"/>' + (w === 0 ? stumm : wellen);
      wirt.dataset.stumm = w === 0 ? 'ja' : 'nein';
    }
    function senden() {
      sendeZeitgeber = 0;
      melde('/lautstaerke', { wert: wert }).then(function (a) {
        if (!a.ok) console.warn('Küchen-Display: Lautstärke ging nicht:', a.status);
      }, function () {});
    }
    // Der Schieber gehört dem Finger: Wisch- und Langdruck-Regeln der Seite sehen seine Berührungen nicht.
    wirt.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    wirt.addEventListener('pointerup', function (e) { e.stopPropagation(); });
    anzeigen(wert);
    // Beim Ziehen alle 120 ms senden, der letzte Wert geht auf jeden Fall noch raus.
    feld.addEventListener('input', function () {
      wert = Number(feld.value);
      zieht = true;
      bis = Date.now() + Regeln.LAUTSTAERKE_SCHUTZ_MS;
      anzeigen(wert);
      if (!sendeZeitgeber) sendeZeitgeber = setTimeout(senden, 120);
    });
    // Auch ein abgebrochenes Ziehen (pointercancel, blur) gibt den Schieber wieder für den Stand des Dienstes frei.
    feld.addEventListener('change', function () { zieht = false; });
    feld.addEventListener('pointercancel', function () { zieht = false; });
    feld.addEventListener('blur', function () { zieht = false; });
    // Bricht der Strom ab, ist der Stand ungewiss: gedimmt, bis beim Wiederverbinden ein neuer kommt.
    quelle.addEventListener('error', function () { wirt.dataset.bereit = 'nein'; });
    quelle.addEventListener('lautstaerke', function (e) {
      const neu = JSON.parse(e.data).wert;
      if (typeof neu !== 'number') return;
      wirt.dataset.bereit = 'ja';
      if (!Regeln.standUebernehmen(zieht || !!sendeZeitgeber, Date.now(), bis)) return;
      wert = neu; anzeigen(neu);
    });
  })();
  // === Ende Lautstärke-Schieber ======================================================================

  // Messung der Bildrate: Abstände zwischen Frames während des Gleitens und in Ruhe.
  if (param.has('messen')) {
    const abstaende = { gleiten: [], ruhe: [] };
    let modus = 'ruhe', letzter = performance.now();
    function frame(t) {
      abstaende[modus].push(t - letzter); letzter = t;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    scr.querySelector('.bahn').addEventListener('transitionstart', function () { modus = 'gleiten'; });
    scr.querySelector('.bahn').addEventListener('transitionend', function () { modus = 'ruhe'; });
    const folge = [3, 2, 1, 0, 1, 2];
    let n = 0;
    const takt = setInterval(function () { setzeSeite(folge[n++ % folge.length]); }, 2500);
    setTimeout(function () {
      clearInterval(takt);
      setzeSeite(HEUTE);
      function auswerten(liste) {
        const s = liste.slice(5).sort(function (a, b) { return a - b; });
        if (!s.length) return null;
        const summe = s.reduce(function (a, b) { return a + b; }, 0);
        return { frames: s.length, fps: Math.round(1000 * s.length / summe * 10) / 10,
                 median_ms: Math.round(s[s.length >> 1] * 10) / 10, p95_ms: Math.round(s[Math.floor(s.length * .95)] * 10) / 10,
                 ueber_33ms: s.filter(function (x) { return x > 33.4; }).length };
      }
      const ergebnis = { gleiten: auswerten(abstaende.gleiten), ruhe: auswerten(abstaende.ruhe) };
      zeigeDebug(JSON.stringify(ergebnis));
      fetch('/messung', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(ergebnis) });
    }, 60000);
  }
})();
</script>
</body>
</html>
