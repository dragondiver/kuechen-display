# Drop-in für die rundfunk-Bridge auf raspi-agent:
#   /etc/systemd/system/rundfunk.service.d/geraete.conf
# Küchen-Display als Netz-Gerät mit Bildschirm (kuechen-display#15, rundfunk#128), seit 8.11.2026.
# Gerätewert, nicht in 1Password. Elektra (ESP32) hat keinen Eintrag und bleibt unverändert.
# Einspielen: docs/stimme-und-geste.md
[Service]
Environment="RUNDFUNK_GERAETE={\"kueche\": {\"name\": \"Küche\", \"oberflaeche\": true, \"zusatz\": \"Gerade sprichst du über das Küchen-Display: ein Bildschirm in der Küche, nicht das runde Gerät im Studio.\"}}"
